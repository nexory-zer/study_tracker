{% extends 'base.html' %}{% from '_macros.html' import csrf with context %}
{% block content %}
<a class="back" href="{{ url_for('journal') }}">← Дневник</a><div class="page-head"><h1>{{ 'Изменить запись' if entry_id else 'Новая запись' }}</h1></div>
<form method="post" class="card form-card">{{ csrf() }}
<label>Дата<input type="date" name="date" value="{{ form.get('date', today) }}" required></label>
<label>Тема<input name="topic" maxlength="200" value="{{ form.get('topic', '') }}" required placeholder="Например, декораторы Python"></label>
<label>Что изучил<textarea name="learned" rows="5" maxlength="10000">{{ form.get('learned', '') }}</textarea></label>
<label>Сложности<textarea name="difficulties" rows="4" maxlength="10000">{{ form.get('difficulties', '') }}</textarea></label>
<label>Связать с занятием<select name="session_id"><option value="">Самостоятельная запись</option>{% for item in sessions %}<option value="{{ item.id }}" {% if form.get('session_id')|string == item.id|string %}selected{% endif %}>{{ item.date }} · {{ item.goal_name }} · {{ format_minutes(item.duration_minutes) }} · №{{ item.id }}</option>{% endfor %}</select></label>
<button class="button primary">Сохранить запись</button></form>
{% if entry_id %}<form class="delete-form" method="post" action="{{ url_for('delete_journal', entry_id=entry_id) }}" data-confirm="Удалить эту запись дневника?">{{ csrf() }}<button class="button danger">Удалить запись</button></form>{% endif %}
{% endblock %}
